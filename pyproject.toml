[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "gum-parser"
version = "0.1.0"
description = "Python parser for the Gum markup language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "gum_parser"
